# A local GitLab (CE) and a runner, to try the pipeline without touching a production GitLab.
#   ./setup.sh            starts it, creates the project, the runner and the variables, and pushes the current HEAD as main
# Web UI: http://localhost:8929 (user root, password in .env). It needs about 4 GB of RAM and 5 to 10 minutes on the first start.
name: ds-gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    hostname: gitlab
    shm_size: 256m
    restart: unless-stopped
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?run ./setup.sh, it creates .env}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        nginx['listen_port'] = 8929
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
  runner:
    image: gitlab/gitlab-runner:latest
    restart: unless-stopped
    depends_on: [gitlab]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-config:/etc/gitlab-runner
volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
